requires-python = ">=3.13,<3.14"
dependencies = ["timenet[cli]==0.12.0", "timenet-connectors==0.12.0"]

[tool.uv]
package = false

[tool.uv.sources]
timenet = { git = "https://github.com/OpenTSLM/TimeNet", rev = "9bd1613019ee61fbc52e02106a1a45990ead7a54", subdirectory = "packages/timenet" }
timenet-connectors = { git = "https://github.com/OpenTSLM/TimeNet", rev = "9bd1613019ee61fbc52e02106a1a45990ead7a54", subdirectory = "packages/timenet-connectors" }
