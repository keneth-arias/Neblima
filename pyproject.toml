[project]
name = "airaware"
version = "0.1.0"
description = "Ingeniería reproducible de datos de calidad del aire para Lima y el Perú"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "duckdb>=1.4,<2",
    "httpx>=0.28,<1",
    "pyarrow>=25,<27",
    "pydantic>=2.12,<3",
    "pyyaml>=6,<7",
    "typer>=0.12,<1",
]

[project.scripts]
airaware = "airaware.cli:app"

[project.optional-dependencies]
geo = ["pyproj>=3.7,<4"]
tabular = ["lightgbm>=4.6,<5"]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["lightgbm>=4.6,<5", "pyproj>=3.7,<4", "pytest>=9,<10", "hypothesis>=6,<7", "ruff>=0.17,<0.18", "ty>=0.0.92,<0.1", "types-pyyaml>=6,<7", "pip-audit>=2,<3"]

[tool.uv]
required-version = ">=0.11.20"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-markers", "-ra"]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.11"
