name: Source verification
description: Record access, scientific semantics, provenance and license evidence
title: "Verify source: "
body:
  - type: input
    id: source
    attributes:
      label: Catalog source_id and official URL
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and verification timestamp
      description: Include coverage, cadence, units, measurement type, access status and license URL. Never paste credentials.
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Decision or blocker
      description: State verified facts, unknowns, restrictions and next action separately.
    validations:
      required: true
