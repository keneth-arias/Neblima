name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.11.20'
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Instalar dependencias fijadas
        run: uv sync --locked
      - name: Controles sin servicios externos
        env:
          UV_OFFLINE: 'true'
        run: make check
      - name: Generar paquetes
        run: make build
      - name: Verificar el comando del paquete
        run: uv run --locked airaware --help
      - name: Instalar el entorno fijado de TimeNet
        if: matrix.python == '3.13.13'
        run: uv sync --project tools/timenet-smoke --python 3.13.13 --locked
      - name: Reproducir el flujo TimeF con la red deshabilitada
        if: matrix.python == '3.13.13'
        run: |
          sudo -n --preserve-env=HOME,PATH,UV_CACHE_DIR unshare --net \
            --setuid "$(id -u)" --setgid "$(id -g)" -- make test-timef-offline
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.11.20'
          python-version: '3.13.13'
      - run: uv sync --locked
      - name: Revisar dependencias contra el servicio de alertas
        run: make audit
