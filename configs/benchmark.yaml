# Política aprobada por Keneth antes de ejecutar. Diagnóstico, no benchmark científico aprobado.
version: comparison-v2
histories: [24, 48, 72, 168]
horizons: [6, 12, 24, 48]
geographies: [lima, callao]
signals: [pm25, pm10]
blockers:
  senamhi-lima-csv:
    - interval_position_unverified
    - quality_flags_unverified
  oefa-csv:
    - lima_timestamps_unresolved
    - timezone_and_interval_unverified
    - wide_table_parameter_units_unresolved
    - quality_flags_unverified
    - attribution_review_pending
# Pesos históricos solo para reproducir v1; comparison-v2 no calcula puntuación.
weights: [0.35, 0.25, 0.15, 0.15, 0.10]
